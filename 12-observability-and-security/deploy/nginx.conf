# Aurora Shop Ops: the SPA and the API, same origin.
#
# The one thing that matters in this file: /api and / are the same host. The
# session cookie and the CSRF token never travel to another origin, so none of
# this needs CORS or SameSite=None in production.

upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The API also sends them in its responses; here they
    # cover the static files, which do not go through FastAPI.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # No 'unsafe-inline': Tailwind puts the styles in a stylesheet, not in <style>.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # The Vite build hashes the file names: they can be cached forever.
    # Careful: an add_header inside a location discards the headers inherited
    # from the server block, so the security headers have to be repeated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # The API. `proxy_buffering off` is what makes the SSE stream arrive event
    # by event: with buffering the spans would pile up and the live waterfall of
    # the interface would stop being "live".
    #
    # The trailing slash of proxy_pass is not a detail: with `proxy_pass http://api`
    # nginx forwards /api/session as is and FastAPI answers 404, because its
    # routes hang from the root. With the slash, /api is replaced by /.
    location /api/ {
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # An SPA is routes: /panel has to return the index, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
